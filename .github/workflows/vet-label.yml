# Labels pull requests that need vetting (vet.yml) before their code is built or run on the maintainer's machines, and
# keeps `vetted` only on a head that a passed vet run vetted. On every event it reads the PR's labels and head from the
# API, not from the event, so the last run for a PR always decides from the PR as it is.
#   flag    Every outside PR gets `needs-vetting`, whatever its files; the comment lists what its report will look at
#           (binaries, submodules, the build, the tools, workflows, agents' and editors' config, git hooks). The
#           owner's own PR is flagged only for new or changed binaries, new download URLs, changes under .github/,
#           submodules, agents' and editors' config, git hooks, build files IDEs act on, and xmake.lua lines that fetch
#           packages, or when the API's file list is cut short: plain edits under tools/ don't count. The rules are in
#           .github/scripts/vet.py (api_flags).
#   vetted  `vetted` stays only if there is a successful run titled "Vet PR <N> at <the PR's head>" of vet.yml on
#           vet-runner, started by the owner, whose commit is on main and whose vet.yml and .github/scripts are still
#           main's. Then a comment "Vetted at <head>" records the run, once; that comment for the current head is what
#           a merge checks. Otherwise the label comes off, with a comment. If anything here fails, the label comes off.
# Like review-label.yml: pull_request_target runs this file from main with a token that can write labels, also for PRs
# from forks. It reads only the API (the PR's file list, vet.yml's runs), never checks out or runs the PR's code, and
# passes everything from the event through env:, never into the script's text.
name: vet-label

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  pull-requests: write
  issues: write
  actions: read   # vet.yml's runs
  contents: read  # main's scripts, and comparing a vet run's commit with main

# One run at a time per PR. A pending run that a newer one replaces does no harm: the newer one reads the PR afresh.
concurrency:
  group: vet-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Read the PR as it is now
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          jq '[.labels[].name]' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/labels.json"
          jq -r '.head.sha, .user.login, .changed_files' "$RUNNER_TEMP/pr.json"

      - name: Flag the PR
        run: |
          set -euo pipefail
          has() { jq -e --arg label "$1" 'index($label) != null' "$RUNNER_TEMP/labels.json" > /dev/null; }
          author=$(jq -r .user.login "$RUNNER_TEMP/pr.json")
          changed=$(jq -r .changed_files "$RUNNER_TEMP/pr.json")
          [[ "$changed" =~ ^[0-9]+$ ]] || changed=0
          rule=(--changed-files "$changed")
          if [ "$author" = "$OWNER" ]; then rule+=(--owner); fi
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[]' > "$RUNNER_TEMP/files.jsonl"
          python3 -I trusted/.github/scripts/vet.py flags "${rule[@]}" "$RUNNER_TEMP/files.jsonl" --comment "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/flags.json"
          jq -r '.reasons[]' "$RUNNER_TEMP/flags.json"
          if ! jq -e .needs_vetting "$RUNNER_TEMP/flags.json" > /dev/null; then
            echo "Nothing that needs vetting"
            exit 0
          fi
          if ! has needs-vetting; then
            gh label create needs-vetting --repo "$REPO" --color d93f0b \
              --description "From outside, or adds binaries, URLs or workflows: the owner runs vet.yml first" 2> /dev/null || true
            gh label create vetted --repo "$REPO" --color 0e8a16 \
              --description "A passed vet.yml run vetted this PR's head, and the owner read its report" 2> /dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label needs-vetting
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Keep `vetted` only on a head a passed vet run vetted
        run: |
          set -euo pipefail
          has() { jq -e --arg label "$1" 'index($label) != null' "$RUNNER_TEMP/labels.json" > /dev/null; }
          if ! has vetted; then echo "No vetted label"; exit 0; fi
          head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head $head"; exit 1; }
          gh api "repos/$REPO/actions/workflows/vet.yml/runs?branch=vet-runner&event=workflow_dispatch&status=success&per_page=100" > "$RUNNER_TEMP/runs.json"
          found=$(jq -r --arg title "Vet PR $PR at $head" --arg owner "$OWNER" '
            first(.workflow_runs[] | select(.display_title == $title and .conclusion == "success"
              and .path == ".github/workflows/vet.yml" and .head_branch == "vet-runner" and .event == "workflow_dispatch"
              and .actor.login == $owner and .triggering_actor.login == $owner) | "\(.html_url) \(.head_sha)") // empty' "$RUNNER_TEMP/runs.json")
          why=""
          if [ -z "$found" ]; then
            why="there is no passed vet run for this PR's head \`$head\`"
          else
            run=${found% *}; run_sha=${found#* }
            [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad run commit $run_sha"; exit 1; }
            # The run's vet.yml must be main's: its commit on main, and its rules still main's.
            on_main=$(gh api "repos/$REPO/compare/main...$run_sha" --jq .status)
            rules() {
              local scripts workflow
              scripts=$(gh api "repos/$REPO/contents/.github?ref=$1" --jq '.[] | select(.name == "scripts") | .sha' 2> /dev/null) || scripts=missing
              workflow=$(gh api "repos/$REPO/contents/.github/workflows/vet.yml?ref=$1" --jq .sha 2> /dev/null) || workflow=missing
              echo "$scripts $workflow"
            }
            if [ "$on_main" != identical ] && [ "$on_main" != behind ]; then
              why="the vet run $run ran vet.yml from \`$run_sha\`, which is not on main ($on_main)"
            elif [ "$(rules "$run_sha")" != "$(rules main)" ]; then
              why="the vet run $run ran under rules that main has changed since (vet.yml or .github/scripts)"
            fi
          fi
          if [ -n "$why" ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/vetted" > /dev/null
            gh pr comment "$PR" --repo "$REPO" --body "\`vetted\` is taken off: $why. Vet this head (vet.yml, from vet-runner), read its report, then add \`vetted\` again."
            exit 0
          fi
          note="Vetted at \`$head\`: $run"
          bodies=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          if ! grep -qxF "$note" <<< "$bodies"; then
            gh pr comment "$PR" --repo "$REPO" --body "$note"
          fi

      - name: If anything above failed, take `vetted` off
        if: failure() || cancelled()
        run: |
          if gh api -X DELETE "repos/$REPO/issues/$PR/labels/vetted" > /dev/null 2>&1; then
            gh pr comment "$PR" --repo "$REPO" --body "The label check failed, so \`vetted\` is taken off: see the vet-label run, then add it again."
          fi
