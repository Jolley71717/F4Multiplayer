# F4Multiplayer settings

# Your name as other players see it. Empty = your Steam name.
sPlayerName =

# --- Hosting ---------------------------------------------------------------
# One player hosts (bHost = true). Friends join through Steam: the host invites
# them from the Steam overlay (Shift+Tab, Friends, right-click, Invite to Game),
# or they right-click the host in their Steam friends list and pick Join Game.
# Nobody opens ports.
bHost = false

# How friends connect:
#   auto   Steam when it's available, otherwise direct UDP (default)
#   steam  Steam only
#   enet   direct UDP to the host's IP address and iPort (LAN, VPN or a
#          forwarded port; the host must allow UDP iPort through the firewall)
sTransport = auto

# Only for joining over direct UDP: the host's IP address ("ip" or "ip:port").
# Leave empty to join through Steam.
sServerAddress =
iPort = 7779
iMaxPlayers = 4
# Optional; everyone must use the same password.
sPassword =
# When hosting: players can hurt each other with weapons (off = only enemies hurt you).
bFriendlyFire = false

# --- Appearance ------------------------------------------------------------
# The character other players see for you (form ID in hex), e.g. 0020A57B for the male
# settler. 0 = they see their own default (iPuppetBaseForm below).
iMyAppearance = 0

# NPC used for other players who haven't picked one (form ID in hex).
#   0020A578  Settler, female (default; no factions)
#   0020A57B  Settler, male (no factions)
#   0002268A  Magnolia (careful: hitting her copy can count as a crime in Goodneighbor)
iPuppetBaseForm = 0020A578

# --- Shared world ----------------------------------------------------------
# Share story, faction and side quest progress (stages only move forward).
# Misc/radiant quests are never shared.
bSyncQuests = true

# With friends in the session, a lethal hit knocks you down instead of killing you. A friend who
# stays next to you for 2 seconds helps you up. Nobody in 45 seconds (or you hold the teleport
# key): you die as usual.
bRevive = true

# Follow the host's time of day and weather.
bSyncTime = true

# Share of a friend's kill XP you also get (0 = off, 1 = the same amount).
fXpShare = 0.5

# --- Hotkeys ---------------------------------------------------------------
# Windows virtual-key codes in hex (70 = F1 ... 7B = F12). 0 turns a key off.
# Player list: where everyone is, their health and level.
iKeyPlayerList = 75
# Teleport to a friend: tap to choose who (each tap picks the next friend),
# then hold the key for a second to go.
iKeyTeleport = 76
# "Over here!": tells everyone where you are.
iKeyPing = 77

# --- Voice chat --------------------------------------------------------------
# Talk to friends through Steam (uses the microphone set in Steam > Settings > Voice).
bVoiceChat = true
# Hold this key to talk. 05 = mouse side button (back), 06 = mouse side button (forward),
# 42 = B, 14 = Caps Lock.
iKeyVoice = 05
# Send your voice whenever you speak, without holding the key.
bVoiceOpenMic = false
# Friends hear you at full volume within 8 meters, fading out at this distance.
# 0 = everyone hears everyone, wherever they are.
fVoiceRange = 60

# --- Misc ------------------------------------------------------------------
# Turn vsync off during loading screens so they finish faster.
bFastLoading = true

# Developer control channel for local testing tools (tools/devctl.ps1).
# Leave this off unless you are developing the mod.
bDevChannel = false
iDevChannelPort = 7790
