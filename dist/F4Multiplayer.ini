# F4Multiplayer settings

# Your name as other players see it. "character" = the name of the character you play (your Steam name until the
# character has one, for instance before a new character is named in Vault 111). Empty = your Steam name. Or write
# any name. It is sent when your game connects, so a change shows from the next time you join or host.
sPlayerName = character

# Language of the mod's own messages and its F1 menu. Empty = the language the game is set to (sLanguage in
# Fallout4.ini). Or name one: en, en-gb, ru, es, ar, de, fr, it, pl, ptbr, ja, cn (Simplified Chinese), zhhant
# (Traditional Chinese). The texts are in the folder Data\F4SE\Plugins\F4Multiplayer\lang, one file per language;
# English is used for anything missing there. Most are first translations by machine and could use corrections
# (INSTALL.md says how to fix or add one).
sLanguage =

# --- Hosting ---------------------------------------------------------------
# One player hosts (bHost = true). Friends join through Steam: the host invites
# them from the Steam overlay (Shift+Tab, Friends, right-click, Invite to Game),
# or they right-click the host in their Steam friends list and pick Join Game.
# Nobody opens ports.
# You can also do all of this in the game: press F1 (iKeyMenu) for the
# multiplayer menu. "Host a session" and "Stop hosting" set bHost here too.
bHost = false

# How friends connect:
#   auto   Steam when it's available, otherwise direct UDP (default)
#   steam  Steam only
#   enet   direct UDP to the host's IP address and iPort (LAN, VPN or a
#          forwarded port; the host must allow UDP iPort through the firewall)
sTransport = auto

# Only for joining over direct UDP: the host's IP address ("ip" or "ip:port").
# Leave empty to join through Steam.
sServerAddress =
iPort = 7779
iMaxPlayers = 4
# Optional; everyone must use the same password.
sPassword =
# When hosting: players can hurt each other with weapons (off = only enemies hurt you).
bFriendlyFire = false
# When hosting: plugins that may differ between players, comma-separated (texture, sound or UI
# mods that add nothing the session shares). Such a plugin may differ only where it loads after
# the other plugins of its kind (full, or .esl/light): before them it changes their form IDs. The
# HD texture pack is allowed the same way: when mods load after it, everyone needs it or nobody.
sIgnoredPlugins =
# When hosting: the shared world (dead NPCs, loot taken, built walls, quests...) is saved to
# Documents\My Games\Fallout4\F4SE\F4Multiplayer.<character>.session, one file per character,
# and carried on next time you host that character with the same load order. Delete a
# character's file to start a fresh session.
bSaveSession = true
# Hear what's said near you in a friend's game: the lines of NPCs they talk to and of their own
# character, in the speaker's recorded voice, from your copy of the speaker (fading with distance,
# about 20 m at most). It is a plain sound, so it can't pull you into a conversation. You always
# see the lines as text too. bVoiceLines and bExperimentalVoiceLines from older versions are no
# longer read.
bSpokenLines = true

# --- Appearance ------------------------------------------------------------
# The character other players see for you (form ID in hex), e.g. 0020A57B for the male
# settler. 0 = they see their own default (iPuppetBaseForm below). Friends see only the two
# settlers or their own default: any other NPC is shown to them as their default.
iMyAppearance = 0

# NPC used for other players who haven't picked one (form ID in hex).
#   0020A578  Settler, female (default; no factions)
#   0020A57B  Settler, male (no factions)
#   0002268A  Magnolia (careful: hitting her copy can count as a crime in Goodneighbor)
iPuppetBaseForm = 0020A578

# Friends' stand-ins can wear their own face: head, hair, complexion, sculpting, skin tone and face
# paint, on a copy of the settler. Off: the settler's face with their sex and body shape, as 0.8.7
# showed everyone. The engine has built no head for such a copy in every try so far (the stand-in
# stands headless for a few seconds, then gets the settler's face by itself), so leave it off.
bFriendFaces = false

# --- Shared world ----------------------------------------------------------
# Share quest progress (stages only move forward, and only once you've started the quest
# yourself). Side quests are shared whatever sStory says. Misc/radiant quests are never shared.
# A friend's step that would move you (teleport, fade, controls off) only happens while you're
# with them, a friend's bribe is never paid from your pockets, and catching up waits out fights.
bSyncQuests = true

# When hosting: the main story and the faction quests.
#   shared  any player's story progress moves everyone's along: each stage runs in every
#           game in turn, achievements included (the game only awards them without mods),
#           and is written into each player's save. Scenes can play out where you aren't,
#           and a friend's faction choices become yours. (default)
#   own     everyone plays their own story; you're told when a friend finishes a story
#           quest. Side quests are still shared.
# Either way, nothing from the session reaches a player who hasn't left Vault 111 yet.
sStory = shared

# With friends in the session, a lethal hit knocks you down instead of killing you. A friend who
# stays next to you for 2 seconds helps you up. Nobody in 45 seconds (or you hold the teleport
# key): you die as usual.
bRevive = true

# Locations a friend discovers show up on your map, ready for fast travel.
bShareMap = true

# Follow the host's time of day and weather.
bSyncTime = true

# Share of a friend's kill XP you also get (0 = off, 1 = the same amount).
fXpShare = 0.5

# --- Hotkeys ---------------------------------------------------------------
# Windows virtual-key codes in hex (70 = F1 ... 7B = F12). 0 turns a key off.
# Multiplayer menu: host a session, join a friend, see who's here, change the
# settings below (friendly fire, story, voice chat, compass markers, fast
# loading; the menu writes them to this file). Works outside a session too.
iKeyMenu = 70
# Player list: where everyone is, their health and level.
iKeyPlayerList = 75
# Teleport to a friend: tap to choose who (each tap picks the next friend),
# then hold the key for a second to go.
iKeyTeleport = 76
# "Over here!": tells everyone where you are.
iKeyPing = 77
# Emotes: point, cheer, clap (F2, F3, F4), played on your stand-in for your friends. (They used to be
# F9, F10 and F11; F9 is the game's own quickload key, which reloaded the game mid-session.)
iKeyEmotePoint = 71
iKeyEmoteCheer = 72
iKeyEmoteClap = 73

# --- Voice chat --------------------------------------------------------------
# Talk to friends through Steam (uses the microphone set in Steam > Settings > Voice).
bVoiceChat = true
# Hold this key to talk. 05 = mouse side button (back), 06 = mouse side button (forward),
# 42 = B, 14 = Caps Lock.
iKeyVoice = 05
# Send your voice whenever you speak, without holding the key.
bVoiceOpenMic = false
# Friends hear you at full volume within 8 meters, fading out at this distance.
# 0 = everyone hears everyone, wherever they are.
fVoiceRange = 60

# --- Misc ------------------------------------------------------------------
# Turn vsync off during loading screens so they finish faster.
bFastLoading = true
# For at most this many seconds of each loading screen: after them vsync comes back while the screen
# is still up, so a loading screen that never ends (a hang) doesn't draw thousands of frames a second.
# A real load is done well within 20 seconds; one that takes longer just finishes at your frame rate.
iFastLoadingSeconds = 20

# While you are in a session, keep your game running when you alt-tab (the game's own bAlwaysActive), so
# your friends still see you and the NPCs your game runs moving. Your character stays live meanwhile: you
# can be hurt while alt-tabbed, and the game's sound keeps playing. Out of a session, and with false, the
# game's own setting is as you have it.
bRunInBackground = true

# Friends' markers on the compass.
bCompassMarkers = true

# When the game freezes for this many seconds (saving, loading and loading screens get four times
# as long), the log says where it was stuck and a short report of that is written next to it, in
# Documents\My Games\Fallout4\F4SE\ (F4Multiplayer-hang-<date>_<time>.txt; the newest 3 are kept).
# The report names the game's files but not where they are, so it is safe to post with a bug report.
# 0 = off.
iHangSeconds = 15
# Also write a minidump of every thread with each report (F4Multiplayer-hang-<date>_<time>.dmp, a few
# megabytes; the newest 3 are kept), for the mod's developers to debug a freeze. Leave this off unless
# you are asked for one: writing it stops the whole game, and if the frozen part holds something the
# dump needs, a freeze the game would have come out of lasts until you close it. It can also clash
# with a crash logger. The dump contains file paths and your Windows user name: send it privately
# to the maintainer, never attach it to a public post or issue.
bHangDump = false

# What the log (Documents\My Games\Fallout4\F4SE\F4Multiplayer.log) holds: info, or debug for more
# detail when you are asked for it. Either way it names other players as "player N", Steam accounts
# by a short alias and IP addresses masked, never by name. The last 3 launches' logs are kept too
# (F4Multiplayer.1.log is the one before this launch).
sLogLevel = info

# Developer control channel for local testing tools (tools/devctl.ps1).
# Leave this off unless you are developing the mod.
bDevChannel = false
iDevChannelPort = 7790
